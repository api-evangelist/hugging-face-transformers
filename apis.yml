- aid: hugging-face-transformers:hugging-face-transformers-scim-api
  name: Hugging Face Transformers scim API
  description: "Use the SCIM API to control and manage your hub Enterprise organization manage members'\
    \ access.\n## Authentication\n\n- Must be organization owner\n- Use Access token with write permission\
    \ on organization\n- Organization must be Enterprise Plus\n\n## Key Attribute Matching\n\n- Microsoft\
    \ Entra ID (Azure AD)\n\t* SAML: `http://schemas.microsoft.com/identity/claims/objectidentifier`\n\
    \t* SCIM: `externalId`\n- Other Identity Providers\n\t* SAML: `NameID` or `unique identifier`\n\t\
    * SCIM: `externalId`\n\n## Supported SCIM User Attributes\n\n| Attribute | Description |\n|---|---|\n\
    | `userName` | Username for the user |\n| `name.givenName` | First name |\n| `name.familyName` | Last\
    \ name |\n| `emails` | Array of user emails; we don't support email types |\n| `externalId` | IDP\
    \ provider's unique identifier |\n| `id` | Hugging Face SCIM endpoint identifier |\n| `active` | Boolean\
    \ for provisioning status |"
  humanURL: https://huggingface.co/docs/transformers/index
