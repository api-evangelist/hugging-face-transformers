                required:
                - namespace
                - user
                - patternRestrictions
                additionalProperties: false
          description: The user has access to the resource, but the endpoint name is restricted by pattern restrictions. Can only be returned if `endpoint` is not provided in the path
      parameters:
      - name: namespace
        in: path
        required: true
        schema:
          type: string
      - name: perms
        in: path
        required: true
        schema:
          type: string
          enum:
