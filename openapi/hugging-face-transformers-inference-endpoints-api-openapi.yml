openapi: 3.2.0
info:
  title: Hub API Endpoints Inference Endpoints API
  version: 0.0.1
  description: We have open endpoints that you can use to retrieve information from the Hub as well as perform certain actions such as creating model, dataset or Space repos.
servers:
- url: https://huggingface.co
  description: Hub
security:
- bearerAuth: []
tags:
- name: Inference Endpoints
  x-displayName: Inference Endpoints
  description: Manage inference endpoints.
paths:
  /api/inference-endpoints/{namespace}/auth-check/{perms}:
    post:
      description: Check if the user has access to the inference endpoint
      summary: Check access
      tags:
      - Inference Endpoints
      responses:
        '200':
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  namespace:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                    required:
                    - id
                    - name
                    additionalProperties: false
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      hasHfLevelAccess:
                        type: boolean
                    required:
                    - id
                    - name
                    additionalProperties: false
                required:
                - namespace
                - user
                additionalProperties: false
          description: The user has access to the inference endpoint/resource
        '207':
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
