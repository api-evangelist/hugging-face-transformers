                              adapterType:
                                const: lora
                              adapterWeightsPath:
                                type: string
                              features:
                                type: object
                                properties:
                                  toolCalling:
                                    type: boolean
                                additionalProperties: false
                              isCheapestPricingOutput:
                                type: boolean
                              isFastestThroughput:
