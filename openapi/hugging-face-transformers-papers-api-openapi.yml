  /api/papers/{paperId}/links:
    post:
      description: Update the project page, GitHub repository, or submitting organization for a paper. Requires the requester to be the paper author, the Daily Papers submitter, or a papers admin.
      summary: Update paper links
      tags:
      - papers
      requestBody:
        content:
          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              type: object
              properties:
                projectPage:
                  anyOf:
                  - type: string
                    format: uri
                  - type: 'null'
                githubRepo:
                  anyOf:
                  - type: string
                    format: uri
                  - type: 'null'
                organizationId:
                  anyOf:
                  - type: string
                    minLength: 24
                    maxLength: 24
                    pattern: ^[0-9a-fA-F]{24}$
                  - type: 'null'
      responses:
        '200':
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties: {}
                additionalProperties: false
          description: Paper links updated
      parameters:
      - name: paperId
        in: path
        required: true
        schema:
          type: string
