        required: true
        schema:
          type: string
  /api/organizations/{name}/socials:
    get:
      description: Get an organization's social media handles
      summary: Get social handles
      tags:
      - orgs
      responses:
        '200':
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  _id:
                    type: string
                  org:
                    type: string
                  socialHandles:
                    type: object
                    properties:
                      twitter:
                        type: string
                      github:
                        type: string
                      linkedin:
                        type: string
                    additionalProperties: false
                required:
                - _id
                - org
                - socialHandles
                additionalProperties: false
          description: The organization's social media handles. Only includes handles that the organization has provided.
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
  /api/avatars/{namespace}:
    get:
