  /api/organizations/{name}/billing/usage-v2:
    get:
      description: Get org usage for a given period
      summary: Get org usage
      tags:
      - orgs
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      - name: startDate
        in: query
        schema:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
        required: true
      - name: endDate
        in: query
        schema:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
        required: true
  /api/organizations/{name}/billing/usage-by-resource-group:
    get:
      description: Get org usage breakdown per resource group for a given period (max 3 months)
      summary: Get org usage by resource group
      tags:
      - orgs
      responses:
        '200':
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  currency:
                    type: string
                  resourceGroups:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          anyOf:
                          - type: string
                          - type: 'null'
                        name:
                          anyOf:
                          - type: string
                          - type: 'null'
                        storage:
                          type: object
                          properties:
                            privateGB:
                              type: number
                            publicGB:
                              type: number
                          required:
                          - privateGB
                          - publicGB
                          additionalProperties: false
                        inference:
                          type: object
                          properties:
                            requestCount:
                              type: number
                            costCents:
                              type: number
                          required:
                          - requestCount
                          - costCents
                          additionalProperties: false
                        compute:
                          type: object
                          properties:
                            spaces:
                              type: object
                              properties:
                                uptimeSec:
                                  type: number
                                costCents:
                                  type: number
                              required:
                              - uptimeSec
                              - costCents
                              additionalProperties: false
                            endpoints:
                              type: object
                              properties:
                                uptimeSec:
                                  type: number
                                costCents:
                                  type: number
                              required:
                              - uptimeSec
                              - costCents
                              additionalProperties: false
                            jobs:
                              type: object
                              properties:
                                uptimeSec:
                                  type: number
                                costCents:
                                  type: number
                              required:
                              - uptimeSec
                              - costCents
                              additionalProperties: false
                          required:
                          - spaces
                          - endpoints
                          - jobs
                          additionalProperties: false
                      required:
                      - id
                      - name
                      - storage
                      - inference
                      - compute
                      additionalProperties: false
                required:
                - currency
                - resourceGroups
                additionalProperties: false
          description: Org usage breakdown per resource group
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      - name: startDate
        in: query
        schema:
          type: string
          format: date-time
          pattern: ^((\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-((0[13578]|1[02])-(0[1-9]|[12]\d|3[01])|(0[469]|11)-(0[1-9]|[12]\d|30)|(02)-(0[1-9]|1\d|2[0-8])))T([01]\d|2[0-3]):[0-5]\d:[0-5]\d(\.\d+)?(Z)$
        required: true
      - name: endDate
        in: query
        schema:
          type: string
          format: date-time
          pattern: ^((\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-((0[13578]|1[02])-(0[1-9]|[12]\d|3[01])|(0[469]|11)-(0[1-9]|[12]\d|30)|(02)-(0[1-9]|1\d|2[0-8])))T([01]\d|2[0-3]):[0-5]\d:[0-5]\d(\.\d+)?(Z)$
        required: true
  /api/organizations/{name}/billing/usage/live:
    get:
      description: Get live usage for org
      summary: Stream usage
      tags:
      - orgs
      parameters:
      - name: name
