                          id:
                            type: string
                        required:
                        - type
                        - id
                        additionalProperties: false
                      - type: object
                        properties:
                          type:
                            const: webhook
                          id:
                            type: string
                        required:
                        - type
                        - id
                        additionalProperties: false
                    status:
                      type: object
                      properties:
                        stage:
                          enum:
                          - COMPLETED
                          - CANCELED
                          - ERROR
                          - DELETED
                          - RUNNING
                          - SCHEDULING
                        message:
                          anyOf:
                          - type: string
                          - type: 'null'
                        cancelReason:
                          anyOf:
                          - enum:
                            - NO_CREDITS
                            - NO_SUBSCRIPTION
                          - type: string
                        failureCount:
                          type: number
                      required:
                      - stage
                      - message
                      additionalProperties: false
                    secrets:
                      type: array
                      items:
                        type: string
                    labels:
                      type: object
                      propertyNames:
                        type: string
                      additionalProperties:
                        type: string
                    hfToken:
                      type: object
                      properties:
                        ownerName:
                          type: string
                        orgName:
                          type: string
                        tokenRole:
                          enum:
