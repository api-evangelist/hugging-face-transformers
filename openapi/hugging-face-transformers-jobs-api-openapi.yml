                          maxLength: 24
                          pattern: ^[0-9a-f]{24}$
                        name:
                          type: string
                        type:
                          enum:
                          - user
                          - org
                        avatarUrl:
                          type: string
                      required:
                      - id
                      - name
                      - type
                      - avatarUrl
                      additionalProperties: false
                    initiator:
                      anyOf:
                      - type: object
                        properties:
                          id:
                            type: string
                            minLength: 24
                            maxLength: 24
                            pattern: ^[0-9a-f]{24}$
                          name:
                            type: string
                          type:
                            enum:
                            - user
                            - org
                          avatarUrl:
                            type: string
                        required:
                        - id
                        - name
                        - type
                        - avatarUrl
                        additionalProperties: false
                      - type: object
                        properties:
                          type:
                            const: scheduled-job
                          id:
                            type: string
                        required:
                        - type
                        - id
                        additionalProperties: false
                      - type: object
                        properties:
                          type:
