                    spaceId:
                      type: string
                    dockerImage:
                      type: string
                    timeout:
                      type: number
                    environment:
                      type: object
                      propertyNames:
                        type: string
                      additionalProperties:
                        type: string
                    command:
                      type: array
                      items:
                        type: string
                    arguments:
                      type: array
                      items:
                        type: string
                    arch:
                      enum:
                      - amd64
                      - arm64
                    flavor:
                      enum:
                      - cpu-basic
                      - cpu-upgrade
                      - cpu-performance
                      - cpu-xl
                      - sprx8
                      - zero-a10g
                      - t4-small
                      - t4-medium
                      - l4x1
                      - l4x4
                      - l40sx1
                      - l40sx4
                      - l40sx8
                      - a10g-small
                      - a10g-large
                      - a10g-largex2
                      - a10g-largex4
                      - a100-large
                      - a100x4
                      - a100x8
                      - h200
                      - h200x2
                      - h200x4
                      - h200x8
                      - rtx-pro-6000
                      - rtx-pro-6000x2
                      - rtx-pro-6000x4
                      - rtx-pro-6000x8
                      - inf2x6
