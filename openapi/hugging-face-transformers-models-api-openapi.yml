  /{namespace}/{repo}/resolve/{rev}/{path}:
    get:
      description: This endpoint requires to follow redirection
      summary: Resolve a file
      tags:
      - models
      responses:
        '200':
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  hash:
                    description: The XET hash of the file
                    type: string
                  refreshUrl:
                    description: The XET auth URL for the file
                    type: string
                  reconstructionUrl:
                    description: The XET reconstruction URL for the file
                    type: string
                  etag:
                    description: The ETag of the file
                    type: string
                  size:
                    description: The size of the file
                    type: number
                required:
                - hash
                - refreshUrl
                - reconstructionUrl
                - etag
                - size
                additionalProperties: false
          description: The XET file info only available if the accept header is set to application/vnd.xet-fileinfo+json
        '302':
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
          description: Redirection to file
        '304':
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
          description: Not modified
        '307':
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
          description: Redirection to Xet endpoint
      parameters:
      - name: namespace
        in: path
        required: true
        schema:
          type: string
      - name: repo
        in: path
        required: true
        schema:
          type: string
      - name: rev
        in: path
        required: true
        schema:
          type: string
      - name: path
        in: path
        required: true
        schema:
          type: string
          description: Wildcard path parameter
      - name: Range
        in: header
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          description: The range in bytes of the file to download
          type: string
      - name: Accept
        in: header
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          description: Returns json information about the XET file info - if the file is a xet file
          const: application/vnd.xet-fileinfo+json
