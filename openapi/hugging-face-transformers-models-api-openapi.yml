  /api/models/{namespace}/{repo}/jwt:
    get:
      description: Generate a JWT token for accessing a repository. Supports optional write access for spaces in dev mode, custom expiration, and encryption.
      summary: Generate JWT
      tags:
      - models
      responses:
        '200':
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  accessToken:
                    description: The JWT token with Bearer prefix
                    type: string
                  exp:
                    description: Token expiration timestamp in seconds (JWT standard)
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  token:
                    description: The JWT token
                    type: string
                  encryptedToken:
                    description: Encrypted JWT token and key ID (only if encrypted=true was requested)
                    type: object
                    properties:
                      encrypted:
                        description: The encrypted JWT token
                        type: string
                      keyId:
                        description: Key ID used to encrypt the token
                        type: string
                    required:
                    - encrypted
                    - keyId
                    additionalProperties: false
                required:
                - accessToken
                - token
                additionalProperties: false
          description: The JWT token and related information
      parameters:
      - name: namespace
        in: path
        required: true
        schema:
          type: string
      - name: repo
        in: path
        required: true
        schema:
          type: string
      - name: write
        in: query
        schema: {}
        required: false
      - name: expiration
        in: query
        schema:
          type: string
          format: date-time
          pattern: ^((\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-((0[13578]|1[02])-(0[1-9]|[12]\d|3[01])|(0[469]|11)-(0[1-9]|[12]\d|30)|(02)-(0[1-9]|1\d|2[0-8])))T([01]\d|2[0-3]):[0-5]\d:[0-5]\d(\.\d+)?(Z)$
        required: false
      - name: encrypted
        in: query
        schema: {}
        required: false
      - name: inference_api
        in: query
        schema: {}
        required: false
      - name: include_pro_status
        in: query
        schema: {}
        required: false
      - name: billing_details
        in: query
        schema: {}
        required: false
  /api/models-tags-by-type:
    get:
      description: Get all possible tags used for models, grouped by tag type. Optionally restrict to only one tag type
      summary: Get model tags
      tags:
      - models
      responses:
        '200':
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                propertyNames:
                  anyOf:
                  - enum:
                    - pipeline_tag
                    - library
                    - dataset
                    - bucket
                    - language
                    - license
                    - arxiv
                    - doi
                    - region
                    - other
                  - not: {}
                additionalProperties:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      label:
                        type: string
                      type:
                        enum:
                        - pipeline_tag
                        - library
                        - dataset
                        - bucket
                        - language
                        - license
                        - arxiv
                        - doi
                        - region
                        - other
                      subType:
                        type: string
                      clickable:
                        default: true
                        type: boolean
                    required:
                    - id
                    - label
                    - type
                    additionalProperties: false
          description: The tags, grouped by tag type
      parameters:
      - name: type
        in: query
        schema:
          enum:
          - pipeline_tag
          - library
          - dataset
          - bucket
          - language
          - license
          - arxiv
          - doi
          - region
          - other
        required: false
