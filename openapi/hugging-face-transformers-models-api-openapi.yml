  /api/models/{namespace}/{repo}/user-access-request/handle:
    post:
      description: Handle a user's access request to a gated repository
      summary: Handle access request
      tags:
      - models
      requestBody:
        content:
          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              type: object
              properties:
                userId:
                  description: Either userId or user must be provided
                  type: string
                  minLength: 24
                  maxLength: 24
                  pattern: ^[0-9a-f]{24}$
                user:
                  description: Either userId or user must be provided
                  type: string
                status:
                  enum:
                  - accepted
                  - rejected
                  - pending
                rejectionReason:
                  type: string
                  maxLength: 200
              required:
              - status
      parameters:
      - name: namespace
        in: path
        required: true
        schema:
          type: string
      - name: repo
        in: path
        required: true
        schema:
          type: string
  /api/models/{namespace}/{repo}/user-access-request/batch:
    post:
      description: Accept or reject up to 100 access requests for a single gated repository in one call. The same `status` (and optional `rejectionReason`) is applied to every request in the list.
      summary: Handle access requests in batch
      tags:
      - models
      requestBody:
        content:
          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              type: object
              properties:
                status:
                  enum:
                  - accepted
                  - rejected
                rejectionReason:
                  type: string
                  maxLength: 200
                requests:
                  minItems: 1
                  maxItems: 100
                  type: array
                  items:
                    type: object
                    properties:
                      userId:
                        description: Either userId or user must be provided
                        type: string
                        minLength: 24
                        maxLength: 24
                        pattern: ^[0-9a-f]{24}$
                      user:
                        description: Either userId or user must be provided
                        type: string
              required:
              - status
              - requests
      responses:
        '200':
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: array
                items:
                  type: object
                  properties:
                    userId:
                      type: string
                    user:
                      type: string
                    ok:
                      type: boolean
                    error:
                      enum:
                      - user_not_found
                      - request_not_found
                  required:
                  - ok
                  additionalProperties: false
          description: Per-request outcomes, in the same order as the input requests array.
      parameters:
      - name: namespace
        in: path
        required: true
        schema:
          type: string
      - name: repo
        in: path
        required: true
        schema:
          type: string
  /api/models/{namespace}/{repo}/user-access-request/grant:
    post:
      description: Grant access to a user for a gated repository
      summary: Grant access
      tags:
      - models
      requestBody:
        content:
          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              description: The user to grant access to either by userId or user
              type: object
              properties:
                userId:
                  type: string
                  minLength: 24
                  maxLength: 24
                  pattern: ^[0-9a-f]{24}$
                user:
                  type: string
      parameters:
      - name: namespace
        in: path
        required: true
        schema:
          type: string
      - name: repo
        in: path
        required: true
        schema:
          type: string
