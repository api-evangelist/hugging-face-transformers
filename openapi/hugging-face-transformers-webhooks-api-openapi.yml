                          - rtx-pro-6000x4
                          - rtx-pro-6000x8
                          - inf2x6
                        timeoutSeconds:
                          default: null
                          anyOf:
                          - type: integer
                            exclusiveMinimum: 0
                            maximum: 9007199254740991
                          - type: 'null'
                        labels:
                          description: Labels for the job as key-value pairs. Both keys and values must be max 100 characters and contain only alphanumeric characters, dots, dashes, and underscores.
                          type: object
                          propertyNames:
                            type: string
