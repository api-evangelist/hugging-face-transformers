                            type: object
                            propertyNames:
                              type: string
                              maxLength: 100
                              pattern: ^[a-zA-Z0-9._-]+$
                            additionalProperties:
                              type: string
                              maxLength: 100
                              pattern: ^[a-zA-Z0-9._-]*$
                          secrets:
                            type: array
                            items:
                              type: string
                        required:
                        - environment
                        - flavor
                        - timeoutSeconds
                        additionalProperties: false
                      jobSourceId:
                        type: string
                      disabled:
                        anyOf:
                        - type: boolean
                        - const: suspended-after-failure
                      watched:
                        type: array
