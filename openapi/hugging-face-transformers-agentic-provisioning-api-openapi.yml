                  properties:
                    status:
                      const: error
                    id:
                      type: string
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                        message:
                          type: string
                      required:
                      - code
                      - message
                      additionalProperties: false
                  required:
                  - status
                  - id
                  - error
                  additionalProperties: false
          description: Resource removal result
        '400':
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  status:
                    const: error
                  id:
                    type: string
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                    required:
                    - code
                    - message
                    additionalProperties: false
                required:
                - status
                - id
                - error
                additionalProperties: false
          description: Resource removal error
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /api/agentic/provisioning/resources/{id}/rotate_credentials:
    post:
      summary: Rotate the credentials for a resource
      tags:
      - agentic-provisioning
      responses:
        '200':
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                anyOf:
                - type: object
                  properties:
                    status:
                      const: complete
                    id:
                      type: string
                    complete:
                      type: object
                      properties:
                        access_configuration:
                          type: object
                          propertyNames:
                            type: string
                          additionalProperties: {}
                      additionalProperties: false
                  required:
                  - status
                  - id
                  - complete
                  additionalProperties: false
                - description: Credential rotation not supported
                  type: object
                  properties:
                    status:
                      const: error
                    id:
                      type: string
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                        message:
                          type: string
                      required:
                      - code
                      - message
                      additionalProperties: false
                  required:
                  - status
                  - id
                  - error
                  additionalProperties: false
          description: Rotated credentials
        '400':
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  status:
                    const: error
                  id:
                    type: string
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                    required:
                    - code
                    - message
                    additionalProperties: false
                required:
                - status
                - id
                - error
                additionalProperties: false
          description: Credential rotation error
        '404':
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  status:
                    const: error
                  id:
                    type: string
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                    required:
                    - code
                    - message
                    additionalProperties: false
                required:
                - status
                - id
                - error
                additionalProperties: false
          description: Resource not found
        '409':
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  status:
                    const: error
                  id:
                    type: string
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                    required:
                    - code
                    - message
                    additionalProperties: false
                required:
