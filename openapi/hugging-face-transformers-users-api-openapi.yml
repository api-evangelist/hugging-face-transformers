          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  _id:
                    type: string
                  user:
                    type: string
                  socialHandles:
                    type: object
                    properties:
                      twitter:
                        type: string
                      github:
                        type: string
                      linkedin:
                        type: string
                      bluesky:
                        type: string
                    additionalProperties: false
                required:
                - _id
                - user
                - socialHandles
                additionalProperties: false
          description: The user's social media handles. Only includes handles that the user has provided.
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
  /api/users/{username}/avatar:
    get:
      description: 'This endpoint returns a JSON with the avatar URL for the user.


        If called with the `Sec-Fetch-Dest: image` header, it instead redirects to the avatar URL'
      summary: Retrieve user avatar
      tags:
      - users
      responses:
        '200':
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  avatarUrl:
                    type: string
                    format: uri
                required:
                - avatarUrl
                additionalProperties: false
          description: Avatar URL
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
      - name: redirect
        in: query
        schema:
          description: Redirect to the avatar url instead of returning it
        required: false
  /api/users/{username}/likes:
    get:
      description: List public repos liked by a user
      summary: List user likes
      tags:
      - users
      responses:
        '200':
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: array
                items:
                  type: object
                  properties:
                    createdAt:
                      type: string
                      format: date-time
                      pattern: ^((\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-((0[13578]|1[02])-(0[1-9]|[12]\d|3[01])|(0[469]|11)-(0[1-9]|[12]\d|30)|(02)-(0[1-9]|1\d|2[0-8])))T([01]\d|2[0-3]):[0-5]\d:[0-5]\d(\.\d+)?(Z)$
                    repo:
                      type: object
                      properties:
                        name:
                          type: string
                        type:
                          enum:
                          - dataset
                          - model
                          - space
                          - bucket
                          - kernel
                      required:
                      - name
                      - type
                      additionalProperties: false
                  required:
                  - createdAt
                  - repo
                  additionalProperties: false
          description: Likes on public repositories
          headers:
            Link:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: string
              description: Link to the next page
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
      - name: limit
        in: query
        schema:
          description: Max number of likes to return
          type: integer
          minimum: 1
          maximum: 9007199254740991
        required: false
      - name: cursor
        in: query
        schema:
          description: Cursor for pagination. Always check to see if more results, a page can be empty or not filled.
          type: string
          minLength: 24
          maxLength: 24
          pattern: ^[0-9a-f]{24}$
        required: false
  /api/avatars/{namespace}:
    get:
      description: Display the avatar for any user or organization. This endpoint redirects to the avatar URL for either a user or an organization
      summary: Get avatar
      tags:
      - users
      parameters:
      - name: namespace
        in: path
        required: true
        schema:
          type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
