openapi: 3.1.0
info:
  title: Hub API Endpoints agentic-provisioning users API
  version: 0.0.1
  description: 'We have open endpoints that you can use to retrieve information from the Hub as well as perform certain actions such as creating model, dataset or Space repos. We offer a wrapper Python client, [`huggingface_hub`](https://github.com/huggingface/huggingface_hub), and a JS client, [`huggingface.js`](https://github.com/huggingface/huggingface.js), that allow easy access to these endpoints. We also provide [webhooks](https://huggingface.co/docs/hub/webhooks) to receive real-time incremental info about repos. Enjoy!


    The base URL for those endpoints below is `https://huggingface.co`. For example, to construct the `/api/models` call below, one can call the URL [https://huggingface.co/api/models](https://huggingface.co/api/models).


    If you''re an Agent, you might prefer the [markdown version OpenAPI spec](https://huggingface.co/.well-known/openapi.md).

    '
servers:
- url: https://huggingface.co
  description: Hub
security:
- bearerAuth: []
tags:
- name: users
  x-displayName: Users
  description: User accounts are the base authoring entity on the Hub
paths:
  /api/settings/mcp:
    get:
      description: Get the MCP tools for the current user
      summary: Get MCP tools
      tags:
      - users
      responses:
        '200':
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  builtInTools:
                    type: array
                    items:
                      type: string
                  spaceTools:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        name:
                          type: string
                        emoji:
                          type: string
                        subdomain:
                          type: string
                      required:
                      - _id
                      - name
                      - emoji
                      - subdomain
                      additionalProperties: false
                required:
                - builtInTools
                - spaceTools
                additionalProperties: false
          description: The MCP tools for the current user
  /api/settings/repositories:
    get:
      summary: List user repositories with storage info
      tags:
      - users
      responses:
        '200':
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    type:
                      enum:
                      - dataset
                      - model
                      - space
                      - bucket
                      - kernel
                    updatedAt:
                      type: string
                    visibility:
                      enum:
                      - public
                      - private
                      - protected
                    storage:
                      type: number
                    storagePercent:
                      type: number
                  required:
                  - id
                  - type
                  - updatedAt
                  - visibility
                  - storage
                  - storagePercent
                  additionalProperties: false
          description: Repositories with storage usage
      parameters:
      - name: search
        in: query
        schema:
          description: Filter repositories by name (case-insensitive substring match)
          type: string
        required: false
      - name: type
        in: query
        schema:
          description: Filter by repository type
          enum:
          - dataset
          - model
          - space
          - bucket
          - kernel
        required: false
      - name: limit
        in: query
        schema:
          description: Max number of repositories to return
          type: integer
          minimum: 1
          maximum: 9007199254740991
        required: false
      - name: sort
        in: query
        schema:
          description: 'Sort field (default: storage)'
          default: storage
          enum:
          - storage
          - updatedAt
        required: false
      - name: direction
        in: query
        schema:
          description: 'Sort direction (default: desc)'
          default: desc
          enum:
          - asc
          - desc
        required: false
  /api/settings/billing/usage:
    get:
      description: Get user usage for a given period
      summary: Get user usage
      tags:
