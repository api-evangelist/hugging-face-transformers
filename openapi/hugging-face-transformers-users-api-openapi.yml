  /api/users/{username}/overview:
    get:
      summary: User overview
      tags:
      - users
      responses:
        '200':
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  _id:
                    type: string
                    minLength: 24
                    maxLength: 24
                    pattern: ^[0-9a-f]{24}$
                  orgs:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        fullname:
                          type: string
                        avatarUrl:
                          type: string
                      required:
                      - id
                      - name
                      - fullname
                      - avatarUrl
                      additionalProperties: false
                  avatarUrl:
                    type: string
                  fullname:
                    type: string
                  isPro:
                    type: boolean
                  user:
                    type: string
                  numModels:
                    type: number
                  numDatasets:
                    type: number
                  numSpaces:
                    type: number
                  numDiscussions:
                    type: number
                  numPapers:
                    type: number
                  numUpvotes:
                    type: number
                  numLikes:
                    type: number
                  numFollowers:
                    type: number
                  numFollowing:
                    type: number
                  details:
                    type: string
                  isFollowing:
                    type: boolean
                  reasonToFollow:
                    type: string
                  type:
                    const: user
                  createdAt:
                    type: string
                    format: date-time
                    pattern: ^((\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-((0[13578]|1[02])-(0[1-9]|[12]\d|3[01])|(0[469]|11)-(0[1-9]|[12]\d|30)|(02)-(0[1-9]|1\d|2[0-8])))T([01]\d|2[0-3]):[0-5]\d:[0-5]\d(\.\d+)?(Z)$
                required:
                - _id
                - avatarUrl
                - fullname
                - isPro
                - user
                - type
                - createdAt
                additionalProperties: false
          description: User overview data including their organizations, stats, and creation date
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
